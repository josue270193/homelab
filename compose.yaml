name: homelab

# Services are added per issue (Traefik in E1, cloudflared in E2, ...).
services:
  # Reverse proxy. Routes come only from labels on containers with traefik.enable=true.
  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --api.dashboard=true
      - --ping=true
      - --log.level=INFO
    ports:
      # Loopback only: the dashboard has no auth, so it must not be reachable from the LAN.
      - "127.0.0.1:80:80"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik skips its own labels until healthy; check fast at boot so the dashboard is up in seconds.
      start_period: 15s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker-socket-proxy
    networks:
      - proxy
      - internal
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN:-localhost}`)
      traefik.http.routers.dashboard.entrypoints: web
      traefik.http.routers.dashboard.service: api@internal

  # Test service: echoes request info. Route comes only from these labels.
  whoami:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami.rule: Host(`whoami.${DOMAIN:-localhost}`)
      traefik.http.routers.whoami.entrypoints: web
      traefik.http.services.whoami.loadbalancer.server.port: "80"
      # Image is FROM scratch (no shell/wget), so no Docker healthcheck is possible.
      # Traefik probes it instead and stops routing to it if /health fails.
      traefik.http.services.whoami.loadbalancer.healthcheck.path: /health
      traefik.http.services.whoami.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.whoami.loadbalancer.healthcheck.timeout: 3s

  # Web UI to manage the stacks in services/ (one folder per stack).
  # EXCEPTION to the socket-proxy rule: managing containers needs full Docker write access, which is
  # root-equivalent with or without a proxy. Only this service mounts the raw socket.
  # Not exposed beyond loopback until Cloudflare Access protects it (#16).
  dockge:
    image: louislam/dockge:1.5.0
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DOCKGE_STACKS_DIR: ${STACKS_DIR:?set STACKS_DIR in .env (absolute path to services/)}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/dockge:/app/data
      # Same absolute path inside and out: Dockge runs `docker compose` against the host daemon,
      # so relative mounts in each stack must resolve to the same host path.
      - ${STACKS_DIR:?set STACKS_DIR in .env (absolute path to services/)}:${STACKS_DIR:?set STACKS_DIR in .env (absolute path to services/)}
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.dockge.rule: Host(`dockge.${DOMAIN:-localhost}`)
      traefik.http.routers.dockge.entrypoints: web
      traefik.http.services.dockge.loadbalancer.server.port: "5001"

  # Spring Boot API (apps/api). Production pulls the image CI publishes to GHCR;
  # on the Mac, compose.override.yaml builds it locally instead.
  # No Traefik route yet (#33). Healthcheck comes from the image and includes the DB connection.
  # Flyway applies apps/api/src/main/resources/db/migration on every start (no-op if up to date).
  api:
    image: ghcr.io/josue270193/homelab-api:${API_TAG:-latest}   # API_TAG=sha-<short sha> pins a build
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-homelab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-homelab}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy      # Traefik will route here (#33)
      - internal   # reach postgres

  # Read-only gate to the Docker API. Traefik uses this instead of the raw socket.
  # Only what Traefik's Docker provider needs is enabled; every POST/write is denied.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # list/inspect containers (labels, IPs)
      NETWORKS: 1     # resolve container networks
      EVENTS: 1       # watch start/stop to update routes
      VERSION: 1
      PING: 1
      POST: 0         # deny all write requests
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      # /_ping goes through the proxy to the Docker daemon, so it checks both.
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # Database. Only on `internal`: no published ports, no internet egress.
  # Apps reach it at postgres:5432 by joining `internal`.
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      # No default on purpose: refuse to start without a password set in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18+ images keep data in a versioned subdir; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # Daily pg_dump of the homelab DB into ./backups/postgres (git-ignored), 7-day retention.
  # Same image as postgres so pg_dump always matches the server version.
  postgres-backup:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/pg-backup.sh"]
    environment:
      TZ: ${TZ:-UTC}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-homelab}
      PGUSER: ${POSTGRES_USER:-homelab}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./scripts/pg-backup.sh:/pg-backup.sh:ro
      - ${BACKUP_DIR:-./backups/postgres}:/backups
    healthcheck:
      # Unhealthy only if the last successful dump is older than 26h (healthy before the first run).
      test: ["CMD-SHELL", "test -z \"$$(find /backups -maxdepth 1 -name .last_success -mmin +1560)\""]
      interval: 5m
      timeout: 5s
      start_period: 10s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # Private DB access over Tailscale. Joins the tailnet as `homelab-db` and forwards ONLY tcp/5432
  # to postgres (tailscale/serve.json). Nothing is published on the host or the internet.
  # Userspace networking: no NET_ADMIN / /dev/net/tun needed.
  tailscale:
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    hostname: homelab-db
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}   # empty: container waits, login URL in `docker compose logs tailscale`
      TS_HOSTNAME: homelab-db
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      # Do NOT enable TS_ENABLE_HEALTH_CHECK / TS_LOCAL_ADDR_PORT or run anything else listening here:
      # in userspace mode, tailnet traffic to this node is forwarded to the container's 127.0.0.1,
      # so any loopback listener becomes reachable from the tailnet.
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    healthcheck:
      # Via the local unix socket (no TCP listener): healthy only when logged in and running.
      test: ["CMD-SHELL", "tailscale --socket=/tmp/tailscaled.sock status --json | grep -q '\"BackendState\": *\"Running\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal   # reach postgres
      - proxy      # egress to Tailscale coordination/relays (internal has none)

volumes:
  postgres-data:

networks:
  # External-facing: Traefik and every service it routes to.
  # Fixed name so stacks outside this project (Dockge, services/*) can join it as `external: true`.
  proxy:
    name: proxy

  # Private: databases and docker-socket-proxy. No published ports, no internet egress.
  # A service that must reach the internet also joins `proxy` (or gets an explicit exception).
  internal:
    name: internal
    internal: true
