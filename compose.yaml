name: homelab

# Services are added per issue (Traefik in E1, cloudflared in E2, ...).
services:
  # Reverse proxy. Routes come only from labels on containers with traefik.enable=true.
  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --api.dashboard=true
      - --ping=true
      - --log.level=INFO
    ports:
      # Loopback only: the dashboard has no auth, so it must not be reachable from the LAN.
      - "127.0.0.1:80:80"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik skips its own labels until healthy; check fast at boot so the dashboard is up in seconds.
      start_period: 15s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker-socket-proxy
    networks:
      - proxy
      - internal
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN:-localhost}`)
      traefik.http.routers.dashboard.entrypoints: web
      traefik.http.routers.dashboard.service: api@internal

  # Test service: echoes request info. Route comes only from these labels.
  whoami:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami.rule: Host(`whoami.${DOMAIN:-localhost}`)
      traefik.http.routers.whoami.entrypoints: web
      traefik.http.services.whoami.loadbalancer.server.port: "80"

  # Read-only gate to the Docker API. Traefik uses this instead of the raw socket.
  # Only what Traefik's Docker provider needs is enabled; every POST/write is denied.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # list/inspect containers (labels, IPs)
      NETWORKS: 1     # resolve container networks
      EVENTS: 1       # watch start/stop to update routes
      VERSION: 1
      PING: 1
      POST: 0         # deny all write requests
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # Database. Only on `internal`: no published ports, no internet egress.
  # Apps reach it at postgres:5432 by joining `internal`.
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-homelab}
      POSTGRES_USER: ${POSTGRES_USER:-homelab}
      # No default on purpose: refuse to start without a password set in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18+ images keep data in a versioned subdir; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # Daily pg_dump of the homelab DB into ./backups/postgres (git-ignored), 7-day retention.
  # Same image as postgres so pg_dump always matches the server version.
  postgres-backup:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/pg-backup.sh"]
    environment:
      TZ: ${TZ:-UTC}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-homelab}
      PGUSER: ${POSTGRES_USER:-homelab}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./scripts/pg-backup.sh:/pg-backup.sh:ro
      - ${BACKUP_DIR:-./backups/postgres}:/backups
    healthcheck:
      # Unhealthy only if the last successful dump is older than 26h (healthy before the first run).
      test: ["CMD-SHELL", "test -z \"$$(find /backups -maxdepth 1 -name .last_success -mmin +1560)\""]
      interval: 5m
      timeout: 5s
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

volumes:
  postgres-data:

networks:
  # External-facing: Traefik and every service it routes to.
  # Fixed name so stacks outside this project (Dockge, services/*) can join it as `external: true`.
  proxy:
    name: proxy

  # Private: databases and docker-socket-proxy. No published ports, no internet egress.
  # A service that must reach the internet also joins `proxy` (or gets an explicit exception).
  internal:
    name: internal
    internal: true
