name: homelab

# Services are added per issue (Traefik in E1, cloudflared in E2, ...).
services:
  # Reverse proxy. Routes come only from labels on containers with traefik.enable=true.
  traefik:
    image: traefik:v3.7.15
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --api.dashboard=true
      - --ping=true
      - --log.level=INFO
    ports:
      # Loopback only: the dashboard has no auth, so it must not be reachable from the LAN.
      - "127.0.0.1:80:80"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik skips its own labels until healthy; check fast at boot so the dashboard is up in seconds.
      start_period: 15s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true
    depends_on:
      - docker-socket-proxy
    networks:
      - proxy
      - internal
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN:-localhost}`)
      traefik.http.routers.dashboard.entrypoints: web
      traefik.http.routers.dashboard.service: api@internal

  # Test service: echoes request info. Route comes only from these labels.
  whoami:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami.rule: Host(`whoami.${DOMAIN:-localhost}`)
      traefik.http.routers.whoami.entrypoints: web
      traefik.http.services.whoami.loadbalancer.server.port: "80"

  # Read-only gate to the Docker API. Traefik uses this instead of the raw socket.
  # Only what Traefik's Docker provider needs is enabled; every POST/write is denied.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # list/inspect containers (labels, IPs)
      NETWORKS: 1     # resolve container networks
      EVENTS: 1       # watch start/stop to update routes
      VERSION: 1
      PING: 1
      POST: 0         # deny all write requests
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  # External-facing: Traefik and every service it routes to.
  # Fixed name so stacks outside this project (Dockge, services/*) can join it as `external: true`.
  proxy:
    name: proxy

  # Private: databases and docker-socket-proxy. No published ports, no internet egress.
  # A service that must reach the internet also joins `proxy` (or gets an explicit exception).
  internal:
    name: internal
    internal: true
