# Builds the API image for linux/amd64 and linux/arm64 (Mac dev + CachyOS PC).
# Build only: pushing to GHCR is #22.
name: api-image

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-image.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions pinned to commit SHAs (tags are mutable); version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU only runs the arm64 runtime stage; Maven runs natively ($BUILDPLATFORM in the Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 + linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Smoke test: the amd64 image (same as the CachyOS PC) must start and report healthy.
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          platforms: linux/amd64
          load: true
          tags: homelab-api:ci
          cache-from: type=gha,scope=api

      - name: Smoke test /actuator/health
        run: |
          docker run -d --name api homelab-api:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect api --format '{{.State.Health.Status}}')
            [ "$status" = healthy ] && break
            sleep 1
          done
          docker logs api | tail -5
          [ "$status" = healthy ] || { echo "::error::container not healthy ($status)"; exit 1; }
          docker exec api wget -qO- http://localhost:8080/actuator/health
