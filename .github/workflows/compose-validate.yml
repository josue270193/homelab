# Validates every Compose file (dev, prod, services/*) on every PR and push to main.
# No path filter on purpose: its check (`compose`) can be made required in the ruleset without
# leaving unrelated PRs waiting for a check that never runs.
name: compose-validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker compose version

      - name: docker compose config (dev, prod, services/*)
        run: ./scripts/validate-compose.sh
